services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Browser should call Next.js through relative /api. The rewrite below uses this internal URL.
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api
        - API_INTERNAL_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - HEYBROSKI_CHAT_MODEL=${HEYBROSKI_CHAT_MODEL:-qwen3:4b}
      - HEYBROSKI_LLM_TEMPERATURE=${HEYBROSKI_LLM_TEMPERATURE:-0.2}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-300}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-128}
    volumes:
      - heybroski_data:/data/heybroski
      - ./demo-data:/app/demo-data:ro
    depends_on:
      ollama:
        condition: service_started
      n8n:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    entrypoint: >
      /bin/sh -c "
        ollama serve &
        sleep 5 &&
        ollama pull ${HEYBROSKI_CHAT_MODEL:-qwen3:4b} &&
        ollama pull ${HEYBROSKI_EMBEDDING_MODEL:-nomic-embed-text} &&
        wait
      "

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  heybroski_data:
  ollama_data:
  n8n_data:
