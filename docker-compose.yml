services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # The host-gateway path works in Docker Desktop and in Codespaces where
      # direct bridge traffic between sibling containers may be filtered.
      - API_INTERNAL_BASE_URL=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - N8N_BASE_URL=http://host.docker.internal:5678
      - HEYBROSKI_CHAT_MODEL=${HEYBROSKI_CHAT_MODEL:-qwen3:4b-instruct}
      - HEYBROSKI_EMBEDDING_MODEL=${HEYBROSKI_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      - HEYBROSKI_LLM_TEMPERATURE=${HEYBROSKI_LLM_TEMPERATURE:-0.2}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-45}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-768}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - HEYBROSKI_DATA_DIR=/data/heybroski
      - HEYBROSKI_DEMO_MODE=${HEYBROSKI_DEMO_MODE:-true}
      - HEYBROSKI_USE_OLLAMA=${HEYBROSKI_USE_OLLAMA:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - heybroski_data:/data/heybroski
      - ./demo-data:/app/demo-data:ro
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NO_CLOUD=1
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_PARALLEL=1
    restart: unless-stopped

  ollama-model:
    image: ollama/ollama:latest
    command: ["pull", "${HEYBROSKI_CHAT_MODEL:-qwen3:4b-instruct}"]
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_started
    restart: on-failure

  ollama-embedding-model:
    image: ollama/ollama:latest
    command: ["pull", "${HEYBROSKI_EMBEDDING_MODEL:-qwen3-embedding:0.6b}"]
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_started
    restart: on-failure

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  heybroski_data:
  ollama_data:
  n8n_data:
