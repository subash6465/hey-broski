## Additional Configuration

### Custom Models
Replace model names in .env:
- HEYBROSKI_CHAT_MODEL=qwen3:8b
- HEYBROSKI_EMBEDDING_MODEL=nomic-embed-text

### Resource Limits
For limited machines, consider modifying the docker-compose.yml:
- Reduce API memory limits
- Use smaller models (qwen3:4b, qwen3:1.7b)
- Consider using qwen3:1.7b for embedding on very low-end machines

### Local Development vs Production

#### Local Development
- Uses docker-compose.yml for all services
- Ollama runs in container
- SQLite in mounted volume
- Easy local development and testing

#### Production Considerations
- Use proper reverse proxy (nginx)
- Use managed Ollama (cloud or self-hosted)
- Consider PostgreSQL instead of SQLite
- Implement proper backups
- Set up monitoring and logging

## Advanced Features

### Custom Extensions
Add new tools by:
1. Implementing in apps/api/app/mcp_tools/
2. Adding to apps/api/app/mcp_tools/registry.py
3. Updating the MCP server in mcp-servers/heybroski/server.py

### Workflow Extensions
Add n8n workflows:
1. Create JSON in n8n/workflows/
2. Import via n8n UI
3. Reference from code using workflow IDs

### Database Extensions
Add new tables:
1. Create migration in apps/api/alembic/versions/
2. Use SQLAlchemy models in apps/api/app/db/models.py
3. Ensure indexes for foreign keys and timestamps

