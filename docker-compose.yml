services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # The host-gateway path works in Docker Desktop and in Codespaces where
      # direct bridge traffic between sibling containers may be filtered.
      - API_INTERNAL_BASE_URL=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - N8N_BASE_URL=http://host.docker.internal:5678
      - HEYBROSKI_CHAT_MODEL=${HEYBROSKI_CHAT_MODEL:-qwen3:8b}
      - HEYBROSKI_LLM_TEMPERATURE=${HEYBROSKI_LLM_TEMPERATURE:-0.2}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-45}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-400}
      - HEYBROSKI_DATA_DIR=/data/heybroski
      - HEYBROSKI_DEMO_MODE=${HEYBROSKI_DEMO_MODE:-true}
      - HEYBROSKI_USE_OLLAMA=${HEYBROSKI_USE_OLLAMA:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - heybroski_data:/data/heybroski
      - ./demo-data:/app/demo-data:ro
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  heybroski_data:
  ollama_data:
  n8n_data:
