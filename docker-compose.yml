# Hey Broski Docker Compose Setup

This docker-compose.yml provides the complete development environment for Hey Broski MVP.

## Services

### web (Next.js Frontend)
- Built with ChatKit for chat interface
- Connects to local backend at http://localhost:8000

### api (FastAPI Backend)
- Main application logic
- LLM gateway through Ollama
- MCP tool registry
- Domain services (email, calendar, docs)
- Database and vector storage
- Scheduled jobs with APScheduler

### ollama (Local LLM)
- ollama/ollama:latest image
- Persistent storage for models
- Qwen3:8b and nomic-embed-text models

### n8n (Automation Engine)
- n8nio/n8n:latest image
- Persistent workflow storage
- Webhook triggers for automations

## Usage

```bash
git clone <repo>
cd hey-broski
cp .env.example .env
docker compose up -d
```

The application will be available at:
- Frontend: http://localhost:3000
- Backend API: http://localhost:8000
- n8n UI: http://localhost:5678
- Ollama API: http://localhost:11434

## Development Notes

- Use `docker compose up -d` to start in background
- Use `docker compose logs -f <service>` to follow logs
- Use `docker compose exec <service> bash` for shell access
- Data persists in the heybroski_data volume
- Models persist in ollama_data volume
- Workflows persist in n8n_data volume

## Model Setup

If models are not found, they will be pulled automatically:
- Qwen3:8b (main chat model)
- nomic-embed-text (embedding model)

## Environment Variables

See .env.example for all available configuration options.

## Health Checks

After startup, verify all services:

```bash
# Check backend health
curl http://localhost:8000/api/health

# Check frontend
curl http://localhost:3000

# Check n8n
curl http://localhost:5678

# Check Ollama
curl http://localhost:11434/api/tags
```

## Backup

To backup data:

```bash
docker compose exec api ls -la /data/heybroski/
docker compose exec api cp heybroski.db /path/to/backup/
docker compose exec ollama cp -r /root/.ollama /path/to/ollama-backup/
docker compose exec n8n cp -r /home/node/.n8n /path/to/n8n-backup/
```

## Development Workflow

1. **Initial setup**: Run `docker compose up -d` and wait for models to download
2. **Check status**: `docker compose ps`
3. **View logs**: `docker compose logs -f`
4. **Enter containers**: `docker compose exec <service> bash`
5. **Restart**: `docker compose restart`
6. **Stop**: `docker compose down`

## File Permissions

Ensure data directory is writable:

```bashn8kdir -p ~/.hey-broski
chmod 700 ~/.hey-broski
```

## Troubleshooting

### "Port is already in use"
Stop existing services: `docker compose down` then restart

### "Model not found"
Check Ollama status: `docker compose logs ollama`
Ensure internet connection for model download

### "Database connection failed"
Check sqlite permissions in the data volume

### "Frontend cannot connect to backend"
Verify service status: `docker compose ps`
Check docker network connectivity

